<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100%;
            background: #1a1a2e;
        }

        /* FIX FOR JAVAFX WEBVIEW */
        .leaflet-tile {
            will-change: unset !important;
            backface-visibility: visible !important;
        }

        .leaflet-fade-anim .leaflet-tile,
        .leaflet-zoom-anim .leaflet-zoom-animated {
            will-change: auto !important;
        }

        /* Hide any canvas rendering artifacts */
        canvas {
            image-rendering: auto;
        }

        .instruction-banner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            color: rgba(255, 255, 255, 0.8);
            padding: 5px 14px;
            border-radius: 14px;
            font-family: 'Segoe UI', Arial, sans-serif;
            font-size: 11px;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="instruction-banner">📍 Cliquez sur la carte pour choisir le point d'analyse</div>
    <div id="map"></div>
    <script>
        L.Browser.any3d = false;
        L.Browser.retina = false;

        var defaultLat = 36.8;
        var defaultLon = 10.18;

        var map = L.map('map', {
            fadeAnimation: false,
            zoomAnimation: false,
            markerZoomAnimation: false,
            zoomSnap: 1,
            zoomDelta: 1,
            trackResize: true,
            preferCanvas: false
        }).setView([defaultLat, defaultLon], 6);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Soil pin marker
        var soilIcon = L.divIcon({
            className: 'soil-marker',
            html: '<div style="width:26px;height:26px;background:rgba(39,174,96,0.9);border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;font-size:13px;">🔬</div>',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        var marker = L.marker([defaultLat, defaultLon], { icon: soilIcon }).addTo(map);
        marker.bindPopup('<b>Point de prélèvement</b><br>Lat: ' + defaultLat.toFixed(4) + '<br>Lon: ' + defaultLon.toFixed(4));

        map.on('click', function (e) {
            var lat = e.latlng.lat;
            var lon = e.latlng.lng;

            marker.setLatLng([lat, lon]);
            marker.setPopupContent('<b>Point de prélèvement</b><br>Lat: ' + lat.toFixed(4) + '<br>Lon: ' + lon.toFixed(4));

            if (typeof app !== 'undefined') {
                app.onLocationSelected(lat, lon);
            }
        });

        function setMarkerPosition(lat, lon) {
            marker.setLatLng([lat, lon]);
            map.setView([lat, lon], 8);
        }
    </script>
</body>

</html>
